# ~/.tmux.conf に足す。prefix N で履歴を開くと、表示中の通知は消える(tmux 3.2 以降)
set -g status-right-length 80
set -g status-right '#{?@notify_nichiji,#[fg=black bg=yellow] #{=36:@notify_nichiji} #[default] ,}#{?@notify,#[fg=black bg=cyan] #{=24:@notify} #[default] ,}%H:%M'
bind N display-popup -E -w 80% -h 80% "tmux set -gu @notify; tmux set -gu @notify_nichiji; tail -n 200 ~/.local/state/tmux-notify.log | tac | less"
